<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Ledger — GTA VI Trophy Guide &amp; Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="hrow">
    <h1>Leonida Ledger</h1>
    <span class="sub">GTA VI Trophy Guide &amp; Tracker · PS5 · all 55 trophies, every step cited</span>
    <span id="collChip" class="chip" title="Collectible progress across every counter in the guide"></span>
    <label class="shieldLab">Spoiler shield <input type="checkbox" id="shieldTgl" checked></label>
    <button id="expBtn" type="button">Export progress</button>
    <label class="impLab">Import<input type="file" id="impFile" accept=".json" hidden></label>
  </div>
  <div id="auditBar" class="audit"></div>
  <nav class="tabbar">
    <button type="button" data-tab="tracker" class="on">Tracker</button>
    <button type="button" data-tab="roadmap">Roadmap</button>
    <button type="button" data-tab="missables">Missables &amp; Risks</button>
    <button type="button" data-tab="sources">Sources</button>
    <input id="qBox" type="search" placeholder="Search trophies, missions, NPCs, places…">
    <select id="gradeSel"><option value="">All grades</option><option>Platinum</option><option>Gold</option><option>Silver</option><option>Bronze</option></select>
    <select id="doneSel"><option value="">All states</option><option value="todo">To do</option><option value="done">Done</option></select>
    <span id="progLab" class="prog"></span>
  </nav>
  <div id="nextUp" class="nextup"></div>
</header>
<main>
  <section id="listCol" aria-label="Trophy list"></section>
  <section id="detailCol" aria-label="Trophy detail"></section>
</main>
<script src="app.js"></script>
</body>
</html>
